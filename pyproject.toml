[project]
name = "gpt2-mlx-cli"
version = "0.1.0"
description = "A from-scratch GPT-2 inference engine and terminal playground for MLX."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.32.3,<0.33",
    "huggingface-hub>=0.34,<1",
    "tokenizers>=0.22,<0.23",
    "safetensors>=0.6,<1",
    "numpy>=2,<3",
    "textual>=6,<9",
]

[project.scripts]
gpt2-mlx-cli = "gpt2_mlx_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2_mlx_cli"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]
reference = ["torch>=2.6,<3", "transformers>=4.50,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the downloaded GPT-2 checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
